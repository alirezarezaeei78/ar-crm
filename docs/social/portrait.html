<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AR CRM — Portrait launch gallery</title>
<style>
@font-face{font-family:Manrope;src:url('../../public/fonts/Manrope.ttf')}
@font-face{font-family:DM;src:url('../../public/fonts/DMSans.ttf')}
*{box-sizing:border-box}html,body{margin:0;width:1080px;height:1440px;overflow:hidden;background:#edf0f3;color:#25323e;font-family:DM,sans-serif}
.slide{width:1080px;height:1440px;position:relative;padding:44px 42px;background:#edf0f3;border-top:12px solid #ec6d43}
.topline{display:flex;justify-content:space-between;align-items:center}.brand{font-family:Manrope,sans-serif;font-size:38px;font-weight:800;letter-spacing:-1.5px}.brand span{color:#df6036}.badge{font-size:20px;font-weight:650;letter-spacing:1px;border:1px solid #cad2da;border-radius:30px;padding:10px 19px;background:white}
.eyebrow{font-size:18px;letter-spacing:3px;font-weight:700;color:#b84621;margin:34px 0 12px}.headline{font-family:Manrope,sans-serif;font-size:68px;line-height:1.1;letter-spacing:-2.8px;margin:0 0 17px;max-width:990px;font-weight:800}.headline em{font-style:normal;color:#d9582f}.description{font-size:27px;line-height:1.4;color:#536373;margin:0;max-width:960px}
.browser{position:absolute;left:42px;right:42px;top:372px;bottom:111px;border:1px solid #d2dae3;border-radius:15px;overflow:hidden;background:white;box-shadow:0 12px 30px #21334c18}.bar{height:40px;background:#fff;display:flex;align-items:center;gap:6px;padding:0 17px;border-bottom:1px solid #dce2e8}.bar i{width:8px;height:8px;border-radius:50%;background:#b7c1cd}.bar span{font-size:16px;color:#516273;margin-left:13px}.screen{height:calc(100% - 40px);overflow:hidden;position:relative;background:#f6f7f9}.screen img{display:block;position:absolute;width:1180px;max-width:none;left:-180px;top:-54px}.slide-1 .screen img{width:2247px;left:-626px;top:-64px}.slide-1 .browser{top:372px}.slide-1 .screen{background:white}.footer{position:absolute;bottom:36px;left:42px;right:42px;display:flex;justify-content:space-between;align-items:center;color:#465767;font-size:20px}.footer strong{font-weight:650}.footer span{font-size:18px;letter-spacing:1px}.note{position:absolute;bottom:82px;left:46px;color:#68798a;font-size:16px}
</style>
</head>
<body><main id="slide"></main>
<script>
const slides=[
{tag:'OPEN-SOURCE RETAIL CRM',title:'Your retail business.<br><em>One clear workspace.</em>',description:'Customers, sales, products, and the next step.',image:'../images/overview.png',view:'Business overview'},
{tag:'CUSTOMER RELATIONSHIPS',title:'Know the customer.<br><em>Build the relationship.</em>',description:'Purchase history, loyalty, value, and notes.',image:'../images/customer-profile.jpg',view:'Customer profile'},
{tag:'SALES + TEAM WORK',title:'Move opportunities.<br><em>Keep work flowing.</em>',description:'Visual pipelines, forecasts, tasks, and automations.',image:'../images/pipeline.png',view:'Sales pipeline'},
{tag:'RETAIL OPERATIONS',title:'Products to purchases.<br><em>Keep it connected.</em>',description:'Catalogs, stock, orders, and retail reporting.',image:'../images/products.png',view:'Product catalog'}
];
const index=Math.max(0,Math.min(3,Number(new URLSearchParams(location.search).get('slide'))||0));
const s=slides[index];
document.querySelector('#slide').outerHTML=`<main class="slide slide-${index}"><div class="topline"><div class="brand"><span>AR</span> CRM</div><span class="badge">OPEN SOURCE · MIT</span></div><p class="eyebrow">${s.tag}</p><h1 class="headline">${s.title}</h1><p class="description">${s.description}</p><div class="browser"><div class="bar"><i></i><i></i><i></i><span>AR CRM / ${s.view}</span></div><div class="screen"><img src="${s.image}" alt="AR CRM ${s.view}, using fictional sample data"></div></div><div class="note">Actual application · Fictional sample data</div><footer class="footer"><strong>github.com/alirezarezaeei78/ar-crm</strong><span>${String(index+1).padStart(2,'0')} / 04</span></footer></main>`;
</script>
</body>
</html>
